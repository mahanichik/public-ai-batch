name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --disable-pip-version-check RapidFuzz==3.14.6 splink==5.0.0 zen-engine==2.1.2 pandas
      - run: python3 -m unittest discover -s tests -v
