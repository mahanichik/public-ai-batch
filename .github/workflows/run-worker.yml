name: Run AI worker
on:
  workflow_dispatch:
    inputs:
      job_json:
        description: "Public/non-sensitive job JSON, max 60KB"
        required: true
        type: string
      deterministic_only:
        required: false
        default: false
        type: boolean
      local_model:
        description: "Run a small open model locally on the public runner"
        required: false
        default: false
        type: boolean
      local_model_name:
        required: false
        default: "qwen3:0.6b"
        type: string
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Write bounded public job
        env:
          JOB_JSON: ${{ inputs.job_json }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          raw=os.environ["JOB_JSON"]
          if len(raw)>60000: raise SystemExit("job_json too large")
          pathlib.Path("job.json").write_text(json.dumps(json.loads(raw)),encoding="utf-8")
          PY
      - name: Install local Ollama model
        if: inputs.local_model == true
        env:
          LOCAL_MODEL: ${{ inputs.local_model_name }}
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve >/tmp/ollama.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:11434/api/tags >/dev/null && break; sleep 1; done
          ollama pull "$LOCAL_MODEL"
          echo "OLLAMA_HOST=http://127.0.0.1:11434" >> "$GITHUB_ENV"
          echo "PUBLIC_OLLAMA_MODEL=$LOCAL_MODEL" >> "$GITHUB_ENV"
      - name: Run bounded AI worker
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          args=()
          if [ "${{ inputs.deterministic_only }}" = "true" ]; then args+=(--deterministic-only); fi
          python3 worker.py --job job.json --out out "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: public-ai-worker-output
          path: out/
          retention-days: 3
